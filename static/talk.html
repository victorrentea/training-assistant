<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-panel {
            background: rgba(39, 28, 83, 0.6);
            backdrop-filter: blur(24px);
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #a3a6ff 0%, #a28efc 100%);
        }
        .pulse-live {
            box-shadow: 0 0 0 0 rgba(255, 110, 132, 0.7);
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 110, 132, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 110, 132, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 110, 132, 0); }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- Desktop Warning -->
<div id="desktop-warning" class="hidden fixed inset-0 z-[100] bg-background flex flex-col items-center justify-center text-center p-8">
  <span class="material-symbols-outlined text-6xl text-primary mb-4">smartphone</span>
  <h1 class="font-headline text-2xl text-on-surface mb-2">Mobile Experience</h1>
  <p class="text-on-surface-variant max-w-sm">This webapp is optimized for mobile devices. Please open it on your phone for the best experience.</p>
</div>
<script>
(function() {
  var w = document.getElementById('desktop-warning');
  function check() { w.classList.toggle('hidden', window.innerWidth <= 768); }
  check();
  window.addEventListener('resize', check);
})();
</script>
<!-- TopAppBar Component -->
<header class="bg-[#0f072e] sticky top-0 z-50 flex justify-between items-center px-4 py-3 w-full">
<div class="flex items-center">
<!-- Space for logo or Title if needed -->
</div>
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
<button class="flex flex-col items-center gap-1 p-2 bg-surface-container-highest/30 hover:bg-surface-container-highest rounded-lg transition-colors min-w-[64px] text-white">
<span class="material-symbols-outlined text-xl">cloud</span>
<span class="text-[10px] font-semibold uppercase tracking-tight">Git Repo</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 bg-surface-container-highest/30 hover:bg-surface-container-highest rounded-lg transition-colors min-w-[64px] text-white">
<span class="material-symbols-outlined text-xl">download</span>
<span class="text-[10px] font-semibold uppercase tracking-tight">Slides</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 bg-surface-container-highest/30 hover:bg-surface-container-highest rounded-lg transition-colors min-w-[64px] text-white">
<span class="material-symbols-outlined text-xl">auto_awesome</span>
<span class="text-[10px] font-semibold uppercase tracking-tight">Summary</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col p-4 md:p-8 max-w-7xl mx-auto w-full gap-8">
<!-- Presentation Slides Section -->
<div class="flex flex-col gap-4">
<!-- Current Slide -->
<div class="relative w-full aspect-video rounded-xl overflow-hidden bg-surface-container-low shadow-2xl group ring-2 ring-primary">
<div class="absolute top-4 left-4 z-10">
<span class="bg-error px-2 py-1 rounded text-[10px] font-bold text-on-error uppercase tracking-wider">Live</span>
</div>
<img alt="Presentation Slide" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity duration-500" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqg_swYg_PP9WtkWua-rtBt1Qmo50lSoKy_7hkIuZKHrK7dsnAK3j3sR0BKEtGTWr_UB8uzH0ldaQbJZrSpgjuId4Q1lcF9FQKXJcqqaDdP48FaBf3tEtkPbQkuH_PiTuWLKRhyAt-nNu3tKP5rJgFwbHiw75kOD2Ow702i2Gh7wwYRwV9IBJPDIAT2n08Yw2ZVLhbcqm1rlNwtI0UdzVw0fVT1U-yNowrsYJsWxt5SkoA1KYyp7h5Ip3X21O7Bo2iRZpavPiKr-A"/>
<!-- Reaction Pulse Cloud (Floating Emojis) -->
<div class="absolute inset-0 pointer-events-none flex items-end justify-center pb-24 overflow-hidden">
<div class="flex gap-4">
<div class="flex flex-col items-center animate-bounce delay-100 opacity-60">
<div class="bg-tertiary-container/80 p-2 rounded-full text-white shadow-lg">👏</div>
</div>
<div class="flex flex-col items-center animate-bounce delay-300 opacity-40 mb-12">
<div class="bg-tertiary-container/80 p-2 rounded-full text-white shadow-lg">🔥</div>
</div>
<div class="flex flex-col items-center animate-bounce delay-0 opacity-80 mb-4">
<div class="bg-tertiary-container/80 p-2 rounded-full text-white shadow-lg">❤️</div>
</div>
<div class="flex flex-col items-center animate-bounce delay-500 opacity-50 mb-20">
<div class="bg-tertiary-container/80 p-2 rounded-full text-white shadow-lg">🚀</div>
</div>
</div>
</div>
</div>
</div>
<!-- Desktop Quick Controls (Emoji Bar) -->
<div class="hidden md:flex bg-surface-container rounded-xl p-6 items-center justify-between w-full">
<div class="flex flex-col">
<span class="text-on-surface-variant font-label text-xs uppercase tracking-widest font-bold">Express Yourself</span>
<p class="text-on-surface text-sm mt-1">Tap an emoji to react in real-time</p>
</div>
<div class="flex gap-3">
<button class="w-12 h-12 rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-all flex items-center justify-center text-2xl hover:scale-110 active:scale-95">👏</button>
<button class="w-12 h-12 rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-all flex items-center justify-center text-2xl hover:scale-110 active:scale-95">❤️</button>
<button class="w-12 h-12 rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-all flex items-center justify-center text-2xl hover:scale-110 active:scale-95">🔥</button>
<button class="w-12 h-12 rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-all flex items-center justify-center text-2xl hover:scale-110 active:scale-95">🚀</button>

<span class="absolute -top-1 -right-1 bg-primary text-on-primary text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">248</span>
</button>

<div class="w-14 h-14 rounded-2xl bg-surface-container-high/50 flex items-center justify-center text-2xl transition-all group-active:scale-90 group-hover:bg-primary-container/20">❤️</div>

<span class="absolute -top-1 -right-1 bg-primary text-on-primary text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">114</span>
</button>
<!-- Rocket -->
<button class="flex flex-col items-center relative group">
<div class="w-14 h-14 rounded-2xl bg-surface-container-high/50 flex items-center justify-center text-2xl transition-all group-active:scale-90 group-hover:bg-primary-container/20">🚀</div>
<span class="absolute -top-1 -right-1 bg-primary text-on-primary text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">405</span>
</button>
</div>
</nav>
<!-- Padding for Fixed Reaction Bar -->
<div class="h-24"></div>
