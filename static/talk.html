<script type="module">
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/build/pdf.worker.min.mjs';

  let _pdfDoc = null;
  let _currentPdfUrl = null;
  let _renderedPages = 0;

  window.renderPage = async function(url, pageNum) {
    const container = document.getElementById('pdf-pages');
    const placeholder = document.getElementById('slide-placeholder');
    try {
      if (_currentPdfUrl !== url) {
        _pdfDoc = await pdfjsLib.getDocument(url).promise;
        _currentPdfUrl = url;
        window._currentPdfUrl = url;
        var dlBtn = document.getElementById('btn-download-slides');
        if (dlBtn) dlBtn.disabled = false;
        container.innerHTML = '';
        _renderedPages = 0;
      }
      pageNum = Math.max(1, Math.min(pageNum || 1, _pdfDoc.numPages));
      // Render all pages on first load of this PDF
      if (_renderedPages === 0) {
        for (let i = 1; i <= _pdfDoc.numPages; i++) {
          const page = await _pdfDoc.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });
          const section = document.createElement('section');
          section.dataset.page = i;
          section.style.cssText = 'position:relative;margin-bottom:7px';
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.className = 'w-full';
          section.appendChild(canvas);
          container.appendChild(section);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          const annotations = await page.getAnnotations({ intent: 'display' });
          if (annotations && annotations.length) {
            const annLayer = document.createElement('div');
            annLayer.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
            section.appendChild(annLayer);
            for (const ann of annotations) {
              if (!ann || ann.subtype !== 'Link' || !(ann.url || ann.unsafeUrl)) continue;
              const rect = viewport.convertToViewportRectangle(ann.rect);
              const left = Math.min(rect[0], rect[2]);
              const top = Math.min(rect[1], rect[3]);
              const width = Math.abs(rect[0] - rect[2]);
              const height = Math.abs(rect[1] - rect[3]);
              if (!(width > 0 && height > 0)) continue;
              const link = document.createElement('a');
              link.href = ann.url || ann.unsafeUrl;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.style.cssText = `position:absolute;left:${left}px;top:${top}px;width:${width}px;height:${height}px;pointer-events:auto;cursor:pointer;background:transparent`;
              annLayer.appendChild(link);
            }
          }
        }
        _renderedPages = _pdfDoc.numPages;
        // Scroll to current slide after initial render
        const initialTarget = container.querySelector(`section[data-page="${pageNum}"]`);
        if (initialTarget) {
          initialTarget.scrollIntoView({ block: 'center' });
          initialTarget.classList.add('slide-highlight');
        }
      }
      if (placeholder) placeholder.style.display = 'none';
    } catch (e) {
      console.error('[talk] PDF render error', e);
    }
  };
</script>
<script>
  var _sessionId = null;
  var _slidesCatalog = [];
  var _ws = null;
  var _currentPage = 1;
  var _activeView = 'slides';
  var _uuid = sessionStorage.getItem('talk_uuid') || (function() {
    var u = crypto.randomUUID(); sessionStorage.setItem('talk_uuid', u); return u;
  })();

  // View names that have a tab button
  var _viewNames = ['speaker', 'slides', 'summary'];

  function showView(name) {
    _viewNames.forEach(function(v) {
      var view = document.getElementById('view-' + v);
      if (view) view.classList.toggle('hidden', v !== name);
      var btn = document.getElementById('btn-' + v);
      if (btn) btn.classList.toggle('active', v === name);
    });
    var fab = document.getElementById('fab-current-slide');
    if (fab) fab.classList.toggle('hidden', name !== 'slides');
    _activeView = name;
    if (name === 'summary') _loadSummary();
    if (name === 'speaker') _renderSpeaker();
  }

  function _enableSummaryButton() {
    var btn = document.getElementById('btn-summary');
    if (btn) btn.disabled = false;
  }

  async function _loadSummary() {
    if (!_sessionId) return;
    var contentEl = document.getElementById('summary-content');
    if (!contentEl) return;
    try {
      var data = await fetch('/' + _sessionId + '/api/participant/summary', {
        headers: { 'X-Participant-ID': _uuid }
      }).then(function(r) { return r.ok ? r.json() : null; });
      if (data && data.raw_markdown) {
        contentEl.innerHTML = marked.parse(data.raw_markdown);
      } else {
        contentEl.innerHTML = '<p style="color:#aea5d4">No summary available yet.</p>';
      }
    } catch (e) {
      contentEl.innerHTML = '<p style="color:#aea5d4">Failed to load summary.</p>';
    }
  }

  function _renderSpeaker() {
    var contentEl = document.getElementById('speaker-content');
    if (!contentEl || contentEl._rendered) return;
    contentEl._rendered = true;
    var dummy = [
      '## Your Speaker',
      '',
      '**Victor Rentea** is an independent trainer, software craftsman, and Java Champion.',
      '',
      '- Lead developer and architect with 11+ years at IBM',
      '- Founder of the Romania Java User Group (RoJUG)',
      '- Trainer at 100+ companies across Europe',
      '- Passionate about clean code, refactoring, and testing',
      '',
      '*"Write code that humans can read."*',
    ].join('\n');
    contentEl.innerHTML = marked.parse(dummy);
  }

  function scrollToCurrentSlide() {
    var container = document.getElementById('view-slides');
    var target = container && container.querySelector('section[data-page="' + _currentPage + '"]');
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var done = false;
    var fallbackTimer;
    function highlight() {
      if (done) return;
      done = true;
      container.removeEventListener('scroll', onScroll);
      target.classList.remove('slide-highlight');
      void target.offsetWidth;
      target.classList.add('slide-highlight');
    }
    var debounceTimer;
    function onScroll() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(highlight, 150);
    }
    container.addEventListener('scroll', onScroll);
    fallbackTimer = setTimeout(highlight, 600);
  }

  var _emojiCounterIds = {
    '👏': 'emoji-count-clap',
    '❤️': 'emoji-count-heart',
    '🔥': 'emoji-count-fire',
    '💡': 'emoji-count-bulb',
    '🚀': 'emoji-count-rocket',
  };

  function _applyEmojiCounters(counters) {
    for (var emoji in _emojiCounterIds) {
      var span = document.getElementById(_emojiCounterIds[emoji]);
      if (!span) continue;
      var count = (counters && counters[emoji]) || 0;
      if (count > 0) {
        span.textContent = count >= 1000 ? (count / 1000).toFixed(1).replace('.0', '') + 'k' : count;
        span.classList.remove('hidden');
      } else {
        span.classList.add('hidden');
      }
    }
  }

  function sendEmoji(emoji, btn) {
    if (window.showDesktopEmojiFloat) showDesktopEmojiFloat(emoji, btn);
    if (!_sessionId) return;
    fetch('/' + _sessionId + '/api/participant/emoji/reaction', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Participant-ID': _uuid },
      body: JSON.stringify({ emoji: emoji })
    }).catch(function() {});
  }

  function _getPage(sc) { return sc.page ?? sc.current_page ?? sc.slide ?? 1; }

  function _findSlide(slug) {
    return _slidesCatalog.find(function(s) { return s.slug === slug; }) || null;
  }

  async function _applySlidesCurrent(sc) {
    if (!sc || !sc.slug) return;
    var slide = _findSlide(sc.slug);
    if (!slide || !slide.url) return;
    _currentPage = _getPage(sc);
    if (window.renderPage) await window.renderPage(slide.url, _currentPage);
  }

  async function _loadCatalog() {
    try {
      var data = await fetch('/' + _sessionId + '/api/slides', { cache: 'no-store' }).then(function(r) { return r.ok ? r.json() : null; });
      var seen = new Set();
      _slidesCatalog = (data && data.slides || []).filter(function(raw) {
        if (!raw || typeof raw !== 'object') return false;
        var slug = String(raw.slug || '').trim() || 'slide';
        var url = String(raw.url || '').trim() || ('/' + _sessionId + '/api/slides/download/' + encodeURIComponent(slug));
        var key = slug + '|' + url;
        if (seen.has(key)) return false;
        seen.add(key);
        raw.slug = slug; raw.url = url;
        return true;
      });
    } catch (e) { console.error('[talk] catalog error', e); }
  }

  function _connectWS() {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    _ws = new WebSocket(proto + '://' + location.host + '/ws/' + _sessionId + '/' + encodeURIComponent(_uuid));
    _ws.onopen = function() { _ws.send(JSON.stringify({ type: 'set_name', name: 'Viewer' })); };
    _ws.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'slides_current' && msg.slides_current) _applySlidesCurrent(msg.slides_current).catch(function() {});
        if (msg.type === 'announce' && msg.slides_current) _applySlidesCurrent(msg.slides_current).catch(function() {});
        if (msg.type === 'emoji_counters_updated' && msg.counters) _applyEmojiCounters(msg.counters);
        if (msg.type === 'summary_updated' && msg.updated_at) _enableSummaryButton();
      } catch (_) {}
    };
    _ws.onclose = function(e) { if (e.code === 1008) return; setTimeout(_connectWS, 3000); };
  }

  document.getElementById('btn-download-slides').addEventListener('click', function() {
    var url = window._currentPdfUrl;
    if (!url) return;
    if (url.indexOf('?') === -1) url += '?download=1'; else url += '&download=1';
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  (async function init() {
    try {
      var status = await fetch('/api/status').then(function(r) { return r.json(); });
      _sessionId = status.session_id;
      if (!_sessionId) return;
      await fetch('/' + _sessionId + '/api/participant/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Participant-ID': _uuid },
        body: JSON.stringify({ name: 'Viewer' })
      }).catch(function() {});
      await _loadCatalog();
      _connectWS();
      var state = await fetch('/' + _sessionId + '/api/participant/state', {
        headers: { 'X-Participant-ID': _uuid }
      }).then(function(r) { return r.json(); }).catch(function() { return {}; });
      console.log('[talk] state:', state);
      if (state.slides_current) await _applySlidesCurrent(state.slides_current);
      if (state.emoji_counters) _applyEmojiCounters(state.emoji_counters);
      if (state.summary_updated_at) _enableSummaryButton();
    } catch (e) { console.error('[talk] init error', e); }
  })();
</script>
</body></html>
