<div id="desktop-warning" class="hidden fixed inset-0 z-[100] bg-background flex flex-col items-center justify-center text-center p-8">

<script>
(function() {
  // Only a real desktop (precise pointer that can hover) AND a wide window gets
  // the warning. Width alone would block phones in landscape (~850 px wide).
  var w = document.getElementById('desktop-warning');
  var desktopPointer = window.matchMedia ? window.matchMedia('(hover: hover) and (pointer: fine)') : null;
  // Laptop attendees can still follow the talk: one tap dismisses it for the visit.
  var dismissed = false;
  try { dismissed = sessionStorage.getItem('talk_desktop_ok') === '1'; } catch (e) {}
  document.getElementById('desktop-warning-continue').addEventListener('click', function() {
    dismissed = true;
    try { sessionStorage.setItem('talk_desktop_ok', '1'); } catch (e) {}
    check();
  });
  function check() {
    var isDesktop = !!(desktopPointer && desktopPointer.matches) && window.innerWidth > 768;
    w.classList.toggle('hidden', dismissed || !isDesktop);
  }
  check();
  window.addEventListener('resize', check);
  if (desktopPointer && desktopPointer.addEventListener) desktopPointer.addEventListener('change', check);
})();
</script>

<script>
  // ── Slide display seam ────────────────────────────────────────────────────────
  // The rest of the page reaches the slides ONLY through showSlide() and
  // isSlideInView(). How slides are delivered and drawn lives in the module below,
  // which hands over its implementation via window._resolveSlideDisplay — so the
  // delivery can be swapped without touching follow, emoji, identity or reconnect.
  var _slideDisplay = null;
  var _slideDisplayReady = new Promise(function(resolve) {
    window._resolveSlideDisplay = function(impl) { _slideDisplay = impl; resolve(impl); };
  });
  // Add `page` of deck `slug` to the slides on screen (loading the deck if
  // needed). opts.scroll brings it into view; opts.highlight flashes it: true
  // always, 'revisit' only when that slide was already on screen.
  function showSlide(slug, page, opts) {
    _slideDisplayReady.then(function(d) { d.show(slug, page, opts || {}); });
  }
  // true/false once that slide is on screen; null while unknown (not rendered
  // yet, a jump still pending, or the slides view hidden).
  function isSlideInView(slug, page, minFraction) {
    return _slideDisplay ? _slideDisplay.isPageInView(slug, page, minFraction) : null;
  }
</script>
<script type="module">
  // ── Slide display: only the slides the trainer has shown ─────────────────────
  // A deck is a large PDF (100+ pages), but a talk shows a subset of it, jumping
  // around. The phone downloads the deck once (one request, retried until it
  // completes) and then draws every slide from memory: a slide change needs no
  // network at all, so a venue Wi-Fi drop can never leave a slide half-loaded.
  // (HTTP range loading was tried: pdf.js reads ~80% of a Google-Slides export on
  // open anyway, costs the single-worker relay ~6x more CPU per phone, and a single
  // failed range request left the document hanging for good.) It renders only
  // pages the trainer has shown during this visit, stacked in the order they were
  // FIRST shown (scrolling back follows the story), each once, each with its
  // clickable link layer. Nothing outside this block knows slides are PDFs.
  // The LEGACY build: the modern one calls URL.parse / Promise.withResolvers and
  // needs Safari 18 / Chrome 126, so phones on iOS 17 or older never saw a slide.
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/legacy/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.4.149/legacy/build/pdf.worker.min.mjs';

  // Every slide is drawn 1440 px wide, whatever the PDF's page size: crisp on a
  // phone screen and under a moderate pinch-zoom. It is drawn on a throwaway
  // canvas and kept as a JPEG <img>: a canvas per shown slide cost ~40 MB of
  // renderer + GPU memory each (measured) and iOS caps total canvas memory, so a
  // long talk crashed the tab; a compressed image is a few hundred KB.
  const RENDER_WIDTH_PX = 1440;
  // A download that makes no progress for this long (a half-open connection after
  // a Wi-Fi roam) is aborted and retried instead of hanging on "Loading slides…".
  const DOWNLOAD_STALL_MS = 20000;
  const sessionId = (location.pathname.split('/')[1] || '').toLowerCase();
  const scroller = document.getElementById('view-slides');
  const container = document.getElementById('pdf-pages');
  const placeholder = document.getElementById('slide-placeholder');
  const downloadBtn = document.getElementById('btn-download-slides');

  function fitSlidesToView() {
    // The parent stays laid out while the Speaker tab hides the slides view.
    document.documentElement.style.setProperty('--slide-max-h', Math.max(120, scroller.parentElement.clientHeight - 8) + 'px');
  }
  fitSlidesToView();
  window.addEventListener('resize', fitSlidesToView);

  let deck = null;     // { slug, url, doc, numPages, opened, queue, pages: Map(page → {section, ready}) }
  let target = null;   // { slug, page, highlight } — scroll there once that page is on screen

  function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }
  function retryDelay(attempt) {  // exponential backoff + jitter: a full room must not retry in lockstep
    return 1000 + Math.random() * Math.min(15000, 1000 * Math.pow(2, attempt));
  }

  function show(slug, page, opts) {
    page = Math.max(1, page | 0);
    if (!deck || deck.slug !== slug) loadDeck(slug);
    const revisit = deck.pages.has(page);
    if (opts.scroll) {
      target = { slug: slug, page: page, highlight: opts.highlight === true || (opts.highlight === 'revisit' && revisit) };
    }
    ensurePage(deck, page);
    jumpIfReady();
  }

  function isPageInView(slug, page, minFraction) {
    if (!deck || deck.slug !== slug || !deck.numPages) return null;
    if (target && target.slug === slug) return null;  // a jump is still pending
    const entry = deck.pages.get(Math.min(page, deck.numPages));
    if (!entry || !entry.ready || !scroller.getClientRects().length) return null;  // not rendered / view hidden
    const view = scroller.getBoundingClientRect();
    const r = entry.section.getBoundingClientRect();
    const visible = Math.min(r.bottom, view.bottom) - Math.max(r.top, view.top);
    return visible >= (minFraction || 0.5) * Math.min(r.height, view.height);
  }

  function loadDeck(slug) {
    if (deck && deck.download) deck.download.abort();
    if (deck && deck.doc) deck.doc.destroy().catch(function() {});
    container.querySelectorAll('img.slide-img').forEach(function(img) { URL.revokeObjectURL(img.src); });
    const url = '/' + sessionId + '/api/slides/download/' + encodeURIComponent(slug);
    deck = { slug: slug, url: url, doc: null, numPages: 0, queue: Promise.resolve(), pages: new Map() };
    deck.opened = openDeck(deck);
    container.replaceChildren();
    placeholder.style.display = '';
    placeholder.querySelector('.text-sm').textContent = 'Loading slides…';  // undo a "can't be shown"
    const spinner = placeholder.querySelector('.material-symbols-outlined');
    if (spinner) spinner.style.animation = 'spin 1s linear infinite';
    downloadBtn.disabled = true;
    window._currentPdfUrl = null;
  }

  // Like participant.html, ask /check first: it makes Railway fetch and cache the
  // PDF when missing. 404 means the daemon cannot fetch this deck itself (not in
  // its catalog, e.g. a deck dropped for the talk) — Railway may still hold it, so
  // try it anyway. Anything else that fails is retried until it works.
  async function openDeck(d) {
    for (let attempt = 0; deck === d; attempt++) {
      try {
        const check = await fetch('/' + sessionId + '/api/slides/check/' + encodeURIComponent(d.slug), {
          cache: 'no-store', headers: { 'X-Participant-ID': window._uuid || '' }
        });
        if (deck !== d) return false;
        if (check.ok || check.status === 404) {
          window._currentPdfUrl = d.url;  // Download works even before (or without) pdf.js
          downloadBtn.disabled = false;
          d.download = new AbortController();
          const data = await downloadDeck(d.url, d.download);
          if (deck !== d) return false;
          let doc;
          try {
            doc = await pdfjsLib.getDocument({ data: data }).promise;
          } catch (e) {
            // A TypeError here is the browser lacking an API pdf.js needs, not the
            // network: retrying cannot help, so say so and point to Download.
            if (e instanceof TypeError) { showUnsupported(); return false; }
            throw e;
          }

        // if it got lost, land on the neutral page that explains it.
        window.location.href = '/?error=invalid';

      _reconnectTimer = setTimeout(_connectWS, _backoffDelay(_wsAttempts++));
    };
  }

  document.getElementById('btn-download-slides').addEventListener('click', function() {
    var url = window._currentPdfUrl;
    if (!url) return;
    if (url.indexOf('?') === -1) url += '?download=1'; else url += '&download=1';
    var a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // A socket that died silently (network switch while the phone was in a pocket)
  // never fires 'close'. The relay sends a heartbeat every 25 s, so a long silence
  // means a dead socket: drop it and connect afresh (the new socket resyncs state).

    _syncState();
    _abandonSocketIfSilent(30000);
  });

  // If the slide module never loads (pdf.js from the CDN blocked, or a browser too
  // old to parse it), say so instead of spinning forever, and offer the deck.
  setTimeout(function() {
    if (_slideDisplay) return;
    var ph = document.getElementById('slide-placeholder');
    var label = ph && ph.querySelector('.text-sm');
    if (label) label.textContent = "Slides can't be shown in this browser. Tap Download to get the deck.";
    var spin = ph && ph.querySelector('.material-symbols-outlined');
    if (spin) spin.style.animation = 'none';
    if (_live && !window._currentPdfUrl) {
      window._currentPdfUrl = '/' + _sessionId + '/api/slides/download/' + encodeURIComponent(_live.slug);
      document.getElementById('btn-download-slides').disabled = false;
    }

  (async function init() {
    if (!_sessionId) return;
    await _ensureIdentity();
    _connectWS();
    _syncState();
  })();
</script>
