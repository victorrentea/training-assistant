<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Notes</title>
  <link rel="stylesheet" href="/static/common.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1rem;
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }
    h1 { font-size: 1.6rem; margin: 0 0 .3rem; }
    h2 { font-size: 1.3rem; margin: 1.5rem 0 .5rem; color: var(--accent); }
    .download-btn {
      display: inline-block;
      margin-left: 1rem;
      padding: .3rem .8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: .9rem;
      cursor: pointer;
      text-decoration: none;
      vertical-align: middle;
    }
    .download-btn:hover { opacity: .85; }
    .notes-pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
      border-radius: 8px;
      padding: 1rem;
      margin: 0;
    }
    .empty { color: var(--muted); }
    .updated { font-size: .75rem; color: var(--muted); text-align: right; margin-top: .5rem; }
    #points.summary-md-content { font-size: 1rem; }
    .code-block {
      position: relative;
      background: #1e1e2e;
      border: 1px solid var(--border, #444);
      border-radius: 6px;
      margin: .5rem 0;
    }
    .code-block pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', Courier, monospace;
      font-size: .92rem;
      line-height: 1.5;
      color: #cdd6f4;
      margin: 0;
      padding: .75rem 2.6rem .75rem .9rem;
      background: transparent;
    }
    .copy-btn {
      position: absolute;
      top: .4rem;
      right: .4rem;
      background: transparent;
      border: 1px solid #555;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      padding: .25rem .35rem;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: .2rem;
      font-size: .72rem;
      transition: color .15s, border-color .15s, background .15s;
    }
    .copy-btn:hover { color: #fff; border-color: #aaa; background: rgba(255,255,255,.08); }
    .copy-btn.copied { color: #a6e3a1; border-color: #a6e3a1; }
  </style>
</head>
<body>
  <h1>Session Notes & Key Points</h1>
  <p style="font-size:.8rem; color:var(--text-muted);">Refresh this page to get the latest data.</p>

  <h2>Session Notes <button id="downloadBtn" class="download-btn" style="display:none" onclick="downloadNotes()"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" style="width:1em;height:1em;fill:currentColor;vertical-align:-.15em;margin-right:.3em;"><path d="M10 3.25a.75.75 0 0 1 .75.75v6.19l2.22-2.22a.75.75 0 1 1 1.06 1.06l-3.5 3.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06l2.22 2.22V4a.75.75 0 0 1 .75-.75Z"></path><path d="M4.5 13.75a.75.75 0 0 1 .75.75v1h9.5v-1a.75.75 0 0 1 1.5 0V16A1.5 1.5 0 0 1 14.75 17.5h-9.5A1.5 1.5 0 0 1 3.75 16v-1.5a.75.75 0 0 1 .75-.75Z"></path></svg> Download .txt</button></h2>
  <div id="notes" class="notes-pre empty">Loading...</div>

  <h2>Key Points</h2>
  <div id="points" class="summary-md-content"><p class="empty">Loading…</p></div>
  <div id="updated" class="updated"></div>

  <script>
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function linkify(html) {
      return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
    }

    const COPY_ICON = `<svg viewBox="0 0 16 16" fill="currentColor" width="13" height="13"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>`;

    function copyCode(btn) {
      const code = btn.nextElementSibling.textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add('copied');
        btn.title = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.title = 'Copy'; }, 1500);
      });
    }

    function makeCodeBlock(code) {
      return `<div class="code-block"><button class="copy-btn" onclick="copyCode(this)" title="Copy">${COPY_ICON} copy</button><pre>${escHtml(code)}</pre></div>`;
    }

    function renderNotes(text) {
      const parts = text.split(/(```[\s\S]*?```|`[^`]+`)/g);
      return parts.map(part => {
        if (part.startsWith('```') && part.endsWith('```')) {
          return makeCodeBlock(part.slice(3, -3).replace(/^\n/, ''));
        }
        if (part.startsWith('`') && part.endsWith('`')) {
          return makeCodeBlock(part.slice(1, -1));
        }
        return linkify(escHtml(part));
      }).join('');
    }

    let notesText = '';
    function downloadNotes() {
      if (!notesText) return;
      const blob = new Blob([notesText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'session-notes.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    const sessionId = window.location.pathname.split('/')[1];
    if (!sessionId) { window.location.href = '/'; }
    const apiBase = '/' + sessionId;

    const savedY = sessionStorage.getItem('notes_scrollY');

    fetch(apiBase + '/api/notes')
      .then(r => {
        if (r.status === 404) { window.location.href = '/?error=invalid'; throw new Error('redirect'); }
        return r.json();
      })
      .then(data => {
        const notesEl = document.getElementById('notes');
        if (data.content) {
          notesText = data.content;
          notesEl.innerHTML = renderNotes(data.content);
          notesEl.classList.remove('empty');
          document.getElementById('downloadBtn').style.display = '';
        } else {
          notesEl.textContent = 'No session notes available yet.';
        }

        const pointsEl = document.getElementById('points');
        const rawMd = data.raw_markdown;
        if (rawMd && typeof marked !== 'undefined') {
          pointsEl.innerHTML = marked.parse(rawMd);
        } else {
          const points = data.summary_points || [];
          if (points.length) {
            pointsEl.innerHTML = '<ul>' + points.map(p => {
              const text = typeof p === 'string' ? p : p.text;
              return `<li>${linkify(escHtml(text))}</li>`;
            }).join('') + '</ul>';
          } else {
            pointsEl.innerHTML = '<p class="empty">No key points yet.</p>';
          }
        }

        if (data.summary_updated_at) {
          const d = new Date(data.summary_updated_at);
          document.getElementById('updated').textContent = 'Updated ' + d.toLocaleTimeString();
        }

        if (savedY) requestAnimationFrame(() => window.scrollTo(0, parseInt(savedY)));
      })
      .catch(() => {
        document.getElementById('notes').textContent = 'Failed to load notes.';
        document.getElementById('points').innerHTML = '<li class="empty">Failed to load.</li>';
      });

    window.addEventListener('beforeunload', () => {
      sessionStorage.setItem('notes_scrollY', String(window.scrollY));
    });
  </script>
</body>
</html>
