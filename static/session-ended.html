<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session ended</title>
  <link rel="icon" href="/static/favicon-participant.svg">
  <!--
    Read-only landing for a RECENT PAST session (registry-valid but not the live
    session). Served at /{session_id}/ by railway/features/pages/router.py in
    place of the participant SPA. It must NOT boot the participant app (which
    would open a live participant WebSocket and proxy to the daemon), so it can
    never leak the CURRENT cohort's session into an old link. Distinct from the
    generic /?error=invalid page used for UNKNOWN ids. {{SESSION_ID}} /
    {{SESSION_DATE_SUFFIX}} are filled in server side from the in-memory registry
    entry (the only past-session data Railway has — the daemon owns the archived
    content and is not connected for past sessions).

    The one script below is the host-machine escape hatch, and it does not weaken
    the above: it never boots the SPA, it only navigates. It learns the live
    session id from the trainer's own loopback daemon, which no participant's
    browser can reach — the same "can you reach 127.0.0.1:1234?" boundary the
    rest of the host-machine features rest on. Without it this page is a dead end
    for the trainer, who reaches it constantly via browser autocomplete of
    yesterday's link and would have to hand-edit the URL to get back in.
  -->
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7f9; color: #1f2933; padding: 24px;
    }
    .card {
      background: #fff; max-width: 460px; width: 100%; padding: 40px 36px; border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .08); text-align: center;
    }
    .icon { font-size: 44px; line-height: 1; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    .muted { color: #66707a; font-size: 14px; margin: 8px 0; line-height: 1.5; }
    .meta { font-size: 13px; margin-top: 16px; color: #66707a; }
    code { background: rgba(127, 127, 127, .15); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
    a.btn {
      display: inline-block; margin-top: 26px; padding: 11px 22px; border-radius: 10px;
      background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1720; color: #e6edf3; }
      .card { background: #182029; box-shadow: none; }
      .muted, .meta { color: #9aa7b4; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">&#128075;</div>
    <h1>This session has ended</h1>
    <p class="muted">This link points to a past session and is now read-only.
      Its live content is no longer available here.</p>
    <p class="meta">Session <code>{{SESSION_ID}}</code>{{SESSION_DATE_SUFFIX}}</p>
    <p class="muted">Ask the host for the current link to join the active session.</p>
    <a class="btn" href="/">Join the current session</a>
  </main>
  <script>
    /* Host-machine only: steer the trainer off this dead end and into the live
       session. Gated on the JS-readable ON_HOST_MACHINE cookie purely so no
       participant's browser fires pointless requests at its own localhost — the
       real boundary is that only the trainer's machine can reach the daemon.
       Polls, so opening yesterday's link BEFORE starting today's session also
       recovers the moment the session starts. */
    (function () {
      var DAEMON = 'http://127.0.0.1:1234';
      var POLL_MS = 1000;
      var TIMEOUT_MS = 800;
      var CODE_RE = /^[a-z0-9]{6}$/;
      var here = (location.pathname.split('/')[1] || '').toLowerCase();

      if (!document.cookie.split(';').some(function (p) {
        return p.trim() === 'ON_HOST_MACHINE=true';
      })) return;

      var inFlight = false;
      async function tick() {
        if (inFlight) return;
        inFlight = true;
        try {
          var code;
          try {
            var r = await fetch(DAEMON + '/api/session/active',
                                { signal: AbortSignal.timeout(TIMEOUT_MS) });
            if (!r.ok) return;
            code = ((await r.json()).session_id || '').toLowerCase();
          } catch (e) {
            return;  // daemon down or not this machine — keep showing the page
          }
          if (!CODE_RE.test(code) || code === here) return;
          // Confirm the gateway knows this session before navigating: steering to
          // an id Railway has not registered yet bounces to /?error=invalid.
          var ok = await fetch('/' + code + '/api/status', { cache: 'no-store' });
          if (!ok.ok) return;
          location.replace('/' + code + '/');
        } finally {
          inFlight = false;
        }
      }
      tick();
      setInterval(tick, POLL_MS);
    })();
  </script>
</body>
</html>
