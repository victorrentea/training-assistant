<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Session - Interact</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon-participant.svg" />
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .landing-card {
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
    }
    .landing-logo {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: .3rem;
      color: var(--accent);
    }
    .landing-subtitle {
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .landing-label {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .7rem;
      display: block;
    }

    /* Shared input style */
    .landing-input {
      width: 100%;
      max-width: 260px;
      background: var(--surface2);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: .85rem 1rem;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: .25em;
      text-transform: uppercase;
      box-sizing: border-box;
      outline: none;
      transition: border-color .15s, color .15s;
    }
    .landing-input:focus {
      border-color: var(--accent);
    }
    .landing-input::placeholder {
      font-weight: 400;
      letter-spacing: .05em;
      text-transform: none;
      font-size: 1rem;
      color: var(--muted);
      opacity: .7;
    }
    .landing-input.input-error {
      color: var(--danger);
      border-color: var(--danger);
    }
    .landing-input.readonly-code {
      opacity: .6;
      cursor: default;
      font-size: 1rem;
      padding: .55rem 1rem;
      margin-bottom: .5rem;
    }

    /* Name input — normal casing */
    .landing-name-input {
      text-transform: none;
      letter-spacing: normal;
      font-size: 1.1rem;
    }

    /* Button styles */
    .landing-btn {
      display: block;
      width: 100%;
      max-width: 260px;
      margin: 1rem auto 0;
      padding: .8rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .landing-btn:hover:not(:disabled) { filter: brightness(1.25); }
    .landing-btn:active:not(:disabled) { transform: scale(.97); }
    .landing-btn:disabled { opacity: .35; cursor: default; }

    .landing-btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: .95rem;
      font-weight: 600;
      margin-top: .6rem;
    }

    /* Screen visibility */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Status / error text */
    .landing-error {
      color: var(--danger);
      font-size: .85rem;
      font-weight: 600;
      margin-top: .8rem;
      min-height: 1.2em;
    }
    .landing-status {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 1rem;
      min-height: 1.2em;
    }
    .landing-status-large {
      font-size: 1.1rem;
      color: var(--muted);
      margin-top: 1.5rem;
    }

    /* Spinner */
    .landing-spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 1.5rem auto;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake {
      animation: shake .4s ease-in-out;
    }

    /* Toaster */
    .toaster {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: var(--danger);
      color: #fff;
      padding: .6rem 1.4rem;
      border-radius: var(--radius);
      font-size: .9rem;
      font-weight: 600;
      z-index: 9999;
      transition: transform .3s ease, opacity .3s ease;
      pointer-events: none;
      opacity: 0;
    }
    .toaster.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Mismatch link */
    .landing-mismatch-link {
      display: inline-block;
      margin-top: 1.2rem;
      color: var(--muted);
      font-size: .85rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .landing-mismatch-link:hover {
      color: var(--text);
    }

    /* Host toggle (bottom-left) */
    .landing-host-toggle {
      position: fixed;
      left: .75rem;
      bottom: .55rem;
      display: inline-flex;
      align-items: center;
      gap: .38rem;
      font-size: .72rem;
      color: var(--muted);
      opacity: .85;
      user-select: none;
      z-index: 20;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .18rem .52rem;
      backdrop-filter: blur(2px);
    }
    .landing-host-status {
      display: none;
      margin-left: .22rem;
      padding-left: .34rem;
      border-left: 1px solid var(--border);
      white-space: nowrap;
    }
    .landing-host-toggle input {
      margin: 0;
      accent-color: var(--accent);
      width: .86rem;
      height: .86rem;
    }
  </style>
</head>
<body>
  <div class="landing-card">

    <!-- Screen: checking -->
    <div id="screen-checking" class="screen active">
      <div class="landing-logo">Interact</div>
      <div class="landing-spinner"></div>
      <div class="landing-status-large">Connecting...</div>
    </div>

    <!-- Screen: error -->
    <div id="screen-error" class="screen">
      <div class="landing-logo">Interact</div>
      <div class="landing-status-large" id="error-title">Host not connected</div>
      <div class="landing-status" id="error-retry-status"></div>
    </div>

    <!-- Screen: code-entry (Case A) -->
    <div id="screen-code-entry" class="screen">
      <div class="landing-logo">Join a Session</div>
      <label class="landing-label" for="code-input">Enter session code</label>
      <input
        id="code-input"
        class="landing-input"
        type="text"
        maxlength="6"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="e.g. k7m2xp"
      />
      <button id="join-btn" class="landing-btn" disabled>Join</button>
      <div id="code-error-msg" class="landing-error"></div>
    </div>

    <!-- Screen: mismatch (Case B) -->
    <div id="screen-mismatch" class="screen">
      <div class="landing-logo">Interact</div>
      <div class="landing-status-large">Session not started</div>
      <a class="landing-mismatch-link" href="/">Click here to enter another session code</a>
    </div>

    <!-- Screen: name-entry -->
    <div id="screen-name-entry" class="screen">
      <div class="landing-logo">Welcome!</div>
      <input
        id="name-session-code"
        class="landing-input readonly-code"
        type="text"
        readonly
        tabindex="-1"
      />
      <label class="landing-label" for="name-input">Choose your name</label>
      <input
        id="name-input"
        class="landing-input landing-name-input"
        type="text"
        maxlength="32"
        autocomplete="off"
        placeholder="Your name"
      />
      <button id="name-join-btn" class="landing-btn" disabled>Join</button>
      <button id="random-name-btn" class="landing-btn landing-btn-secondary">Random name</button>
      <div id="name-error-msg" class="landing-error"></div>
    </div>

    <!-- Screen: entering -->
    <div id="screen-entering" class="screen">
      <div class="landing-logo">Interact</div>
      <div class="landing-spinner"></div>
      <div class="landing-status-large">Joining...</div>
    </div>

  </div>

  <!-- Toaster -->
  <div id="toaster" class="toaster"></div>

  <!-- ON_HOST_MACHINE toggle -->
  <label class="landing-host-toggle" for="host-machine-toggle">
    <input id="host-machine-toggle" type="checkbox" />
    <span>ON_HOST_MACHINE</span>
    <span id="host-machine-status" class="landing-host-status" aria-live="polite"></span>
  </label>

  <script>
    // ── Constants ──
    const SESSION_CODE_RE = /^[a-z0-9]{6}$/;
    const LOCAL_DAEMON_POLL_MS = 1000;
    const RETRY_DELAYS = [1000, 2000, 3000, 5000, 5000];  // 5 attempts
    const LS_UUID_KEY = 'workshop_participant_uuid';
    const LS_NAME_KEY = 'workshop_participant_name';
    const LS_CUSTOM_NAME_KEY = 'workshop_custom_name';
    const ON_HOST_MACHINE_COOKIE = 'ON_HOST_MACHINE';

    // ── Host detection ──
    function isHostCookie() {
      return document.cookie.includes('is_host=1');
    }

    function getStorage() {
      return isHostCookie() ? sessionStorage : localStorage;
    }

    // ── ON_HOST_MACHINE cookie ──
    function hasOnHostMachineCookie() {
      return document.cookie.split(';').some(p => p.trim() === `${ON_HOST_MACHINE_COOKIE}=true`);
    }
    function setOnHostMachineCookie(enabled) {
      if (enabled) {
        document.cookie = `${ON_HOST_MACHINE_COOKIE}=true; path=/; SameSite=Lax; max-age=31536000`;
      } else {
        document.cookie = `${ON_HOST_MACHINE_COOKIE}=; path=/; max-age=0`;
      }
    }

    // ── Screen management ──
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      const screen = document.getElementById('screen-' + id);
      if (screen) screen.classList.add('active');
    }

    // ── Toaster ──
    let toasterTimeout = null;
    function showToast(msg) {
      const el = document.getElementById('toaster');
      el.textContent = msg;
      el.classList.add('visible');
      clearTimeout(toasterTimeout);
      toasterTimeout = setTimeout(() => el.classList.remove('visible'), 3000);
    }

    // ── Shake animation ──
    function shakeElement(el) {
      el.classList.remove('shake');
      void el.offsetWidth; // force reflow
      el.classList.add('shake');
    }

    // ── URL helpers ──
    function getSessionIdFromUrl() {
      return new URLSearchParams(window.location.search).get('session_id') || '';
    }

    function normalizeCode(raw) {
      return String(raw || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
    }

    function isCompleteCode(code) {
      return SESSION_CODE_RE.test(String(code || ''));
    }

    // ── API helpers ──
    function apiUrl(sessionId, path) {
      return '/' + sessionId + path;
    }

    async function checkActiveSession() {
      const resp = await fetch('/api/is-active-session', { cache: 'no-store' });
      if (!resp.ok) throw new Error('Request failed');
      return await resp.json();
    }

    async function validateSessionCode(code) {
      const resp = await fetch(apiUrl(code, '/api/status'), { cache: 'no-store' });
      return resp.ok;
    }

    async function registerParticipant(sessionId, uuid, name) {
      const body = name ? { name } : {};
      const resp = await fetch(apiUrl(sessionId, '/api/participant/register'), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Participant-ID': uuid,
        },
        body: JSON.stringify(body),
      });
      return resp;
    }

    async function renameParticipant(sessionId, uuid, name) {
      const resp = await fetch(apiUrl(sessionId, '/api/participant/name'), {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Participant-ID': uuid,
        },
        body: JSON.stringify({ name }),
      });
      return resp;
    }

    // ── Enter the app ──
    function enterApp(sessionId, name) {
      const storage = getStorage();
      storage.setItem(LS_NAME_KEY, name);
      window.location.href = '/' + sessionId;
    }

    // ── ON_HOST_MACHINE toggle ──
    function initHostMachineToggle() {
      const toggle = document.getElementById('host-machine-toggle');
      if (!toggle) return;
      toggle.checked = hasOnHostMachineCookie();
      renderHostMachineStatus();
      toggle.addEventListener('change', () => {
        setOnHostMachineCookie(toggle.checked);
        renderHostMachineStatus();
        if (toggle.checked) pollLocalDaemonOnce();
      });
    }

    let lastLocalRetryAt = 0;
    let lastLocalRetryState = 'no_active_session';

    function renderHostMachineStatus() {
      const el = document.getElementById('host-machine-status');
      if (!el) return;
      if (!hasOnHostMachineCookie()) {
        el.style.display = 'none';
        return;
      }
      el.style.display = 'inline';
      if (!lastLocalRetryAt) {
        el.textContent = 'Waiting...';
        return;
      }
      const time = new Date(lastLocalRetryAt).toLocaleTimeString([], { hour12: false });
      if (lastLocalRetryState === 'daemon_offline') {
        el.textContent = 'Daemon offline (' + time + ')';
      } else {
        el.textContent = 'No session (' + time + ')';
      }
    }

    // ── Local daemon polling (ON_HOST_MACHINE background) ──
    let localDaemonInterval = null;

    function pollLocalDaemonOnce() {
      if (!hasOnHostMachineCookie()) return;
      fetch('http://localhost:1234/api/session/active', { signal: AbortSignal.timeout(800) })
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          const code = normalizeCode(data && data.session_id);
          if (!isCompleteCode(code)) {
            lastLocalRetryAt = Date.now();
            lastLocalRetryState = 'no_active_session';
            renderHostMachineStatus();
            return;
          }
          // Found an active session on the local daemon — redirect to participant page
          window.location.href = '/' + code + '/';
        })
        .catch(() => {
          lastLocalRetryAt = Date.now();
          lastLocalRetryState = 'daemon_offline';
          renderHostMachineStatus();
        });
    }

    function startLocalDaemonPolling() {
      pollLocalDaemonOnce();
      if (localDaemonInterval) clearInterval(localDaemonInterval);
      localDaemonInterval = setInterval(pollLocalDaemonOnce, LOCAL_DAEMON_POLL_MS);
    }

    // ── Step 1: is-active-session check with retries ──
    async function checkActiveWithRetries() {
      showScreen('checking');
      const isOnHost = hasOnHostMachineCookie();
      let attempt = 0;
      const maxAttempts = isOnHost ? Infinity : RETRY_DELAYS.length;

      while (true) {
        try {
          const data = await checkActiveSession();
          if (data.active) {
            return true;  // session is active, proceed
          }
          showScreen('error');
          if (!data.daemon_connected) {
            document.getElementById('error-title').textContent = 'Host not connected';
          } else {
            document.getElementById('error-title').textContent = 'No session started';
          }
        } catch (e) {
          // request failed (Railway itself is down)
          showScreen('error');
          document.getElementById('error-title').textContent = 'Host not connected';
        }

        attempt++;
        if (!isOnHost && attempt >= maxAttempts) {
          document.getElementById('error-retry-status').textContent =
            'Could not connect. Reload to try again.';
          return false;  // exhausted
        }

        // Show retry countdown
        const delayMs = isOnHost ? 3000 : RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)];
        document.getElementById('error-retry-status').textContent =
          'Retrying (' + attempt + '/' + (isOnHost ? '...' : maxAttempts) + ')...';

        await new Promise(resolve => setTimeout(resolve, delayMs));
      }
    }

    // ── Step 2: Resolve session_id ──
    async function resolveSessionId() {
      const sessionId = getSessionIdFromUrl();

      if (!sessionId) {
        // Case A: no session_id — show code entry
        return await codeEntryFlow();
      }

      // Has session_id — validate and redirect to session page
      const valid = await validateSessionCode(sessionId);
      if (!valid) {
        // Case B: mismatch
        showScreen('mismatch');
        return null;  // dead end
      }

      // Case C: valid session — redirect to participant page
      window.location.href = '/' + sessionId + '/';
      return null;  // navigating away
    }

    // ── Case A: Code entry screen ──
    function codeEntryFlow() {
      return new Promise((resolve) => {
        showScreen('code-entry');
        const input = document.getElementById('code-input');
        const btn = document.getElementById('join-btn');
        const errorMsg = document.getElementById('code-error-msg');

        function updateBtn() {
          const code = normalizeCode(input.value);
          btn.disabled = !isCompleteCode(code);
        }

        async function submit() {
          const code = normalizeCode(input.value);
          if (!isCompleteCode(code)) return;
          btn.disabled = true;
          errorMsg.textContent = '';

          const valid = await validateSessionCode(code);
          if (valid) {
            // Redirect to session participant page
            window.location.href = '/' + code + '/';
            // resolve won't fire because we're navigating away
          } else {
            input.classList.add('input-error');
            shakeElement(input);
            showToast('Invalid session code');
            btn.disabled = false;
            setTimeout(() => input.classList.remove('input-error'), 1500);
          }
        }

        input.addEventListener('input', () => {
          const normalized = normalizeCode(input.value);
          if (input.value !== normalized) input.value = normalized;
          errorMsg.textContent = '';
          input.classList.remove('input-error');
          updateBtn();
          // Auto-submit when 6 chars entered
          if (isCompleteCode(normalized)) {
            submit();
          }
        });

        input.addEventListener('paste', (event) => {
          const pasted = (event.clipboardData || window.clipboardData).getData('text').trim();
          // Smart paste: extract code from full URL
          const urlMatch = pasted.match(/^https?:\/\/[^/]+\/([a-zA-Z0-9]{4,8})\/?$/);
          if (urlMatch) {
            event.preventDefault();
            input.value = normalizeCode(urlMatch[1]);
            input.dispatchEvent(new Event('input'));
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !btn.disabled) submit();
        });

        btn.addEventListener('click', submit);
        input.focus();
        updateBtn();
      });
    }

    // ── Registration + name entry flow ──
    async function registrationFlow(sessionId) {
      const storage = getStorage();
      const isHost = isHostCookie();

      // Get or create UUID
      let uuid = storage.getItem(LS_UUID_KEY);
      if (!uuid) {
        uuid = crypto.randomUUID();
        storage.setItem(LS_UUID_KEY, uuid);
      }

      // Check if returning participant with stored custom name
      const hasStoredCustomName = storage.getItem(LS_CUSTOM_NAME_KEY) === '1';

      // Register (idempotent for returning participants)
      showScreen('entering');
      const regResp = await registerParticipant(sessionId, uuid);
      if (!regResp.ok) {
        // Unexpected error — just show name entry as fallback
        return await nameEntryFlow(sessionId, uuid);
      }
      const regData = await regResp.json();

      // Returning participant with a custom name — enter directly
      if (hasStoredCustomName) {
        enterApp(sessionId, regData.name);
        return;
      }

      // Host flow: append " (host)" and enter immediately
      if (isHost) {
        const hostName = regData.name + ' (host)';
        // Rename to add (host) suffix
        await renameParticipant(sessionId, uuid, hostName);
        storage.setItem(LS_CUSTOM_NAME_KEY, '1');
        enterApp(sessionId, hostName);
        return;
      }

      // New participant — show name entry
      await nameEntryFlow(sessionId, uuid);
    }

    // ── Name entry screen ──
    function nameEntryFlow(sessionId, uuid) {
      return new Promise((resolve) => {
        showScreen('name-entry');
        const sessionCodeInput = document.getElementById('name-session-code');
        const nameInput = document.getElementById('name-input');
        const joinBtn = document.getElementById('name-join-btn');
        const randomBtn = document.getElementById('random-name-btn');
        const errorMsg = document.getElementById('name-error-msg');

        sessionCodeInput.value = sessionId.toUpperCase();

        function updateBtn() {
          joinBtn.disabled = !nameInput.value.trim();
        }

        nameInput.addEventListener('input', () => {
          errorMsg.textContent = '';
          updateBtn();
        });

        nameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !joinBtn.disabled) submitName();
        });

        async function submitName() {
          const name = nameInput.value.trim();
          if (!name) return;
          joinBtn.disabled = true;
          randomBtn.disabled = true;
          errorMsg.textContent = '';

          // Register first (idempotent), then rename
          await registerParticipant(sessionId, uuid);
          const renameResp = await renameParticipant(sessionId, uuid, name);

          if (renameResp.status === 409) {
            shakeElement(nameInput);
            showToast('Name taken');
            joinBtn.disabled = false;
            randomBtn.disabled = false;
            return;
          }

          if (renameResp.status === 204 || renameResp.ok) {
            const storage = getStorage();
            storage.setItem(LS_CUSTOM_NAME_KEY, '1');
            enterApp(sessionId, name);
            return;
          }

          // Other error
          errorMsg.textContent = 'Something went wrong. Please try again.';
          joinBtn.disabled = false;
          randomBtn.disabled = false;
        }

        async function submitRandomName() {
          joinBtn.disabled = true;
          randomBtn.disabled = true;
          errorMsg.textContent = '';

          const resp = await registerParticipant(sessionId, uuid);
          if (resp.ok) {
            const data = await resp.json();
            enterApp(sessionId, data.name);
            return;
          }

          errorMsg.textContent = 'Something went wrong. Please try again.';
          joinBtn.disabled = false;
          randomBtn.disabled = false;
        }

        joinBtn.addEventListener('click', submitName);
        randomBtn.addEventListener('click', submitRandomName);
        nameInput.focus();
        updateBtn();
      });
    }

    // ── Main flow ──
    async function main() {
      initHostMachineToggle();
      startLocalDaemonPolling();

      // Step 1: Check if backend is active
      const active = await checkActiveWithRetries();
      if (!active) return;  // stuck on error screen

      // Step 2: Resolve session_id
      const sessionId = await resolveSessionId();
      if (!sessionId) return;  // stuck on mismatch or code entry (navigating away)

      // Step 3: Registration + name
      await registrationFlow(sessionId);
    }

    main();
  </script>

  <script src="/static/version.js"></script>
  <script src="/static/work-hours.js"></script>
  <script src="/static/version-age.js"></script>
  <script src="/static/version-reload.js"></script>
  <div class="version-tag" id="version-tag"></div>
  <script>window.renderDeployAge && window.renderDeployAge('version-tag');</script>
</body>
</html>
