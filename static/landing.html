<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Session - Interact</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon-participant.svg" />
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .landing-card {
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
    }
    .landing-logo {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: .3rem;
      color: var(--accent);
    }
    .landing-subtitle {
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .landing-label {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .7rem;
      display: block;
    }
    .landing-input {
      width: 100%;
      max-width: 260px;
      background: var(--surface2);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: .85rem 1rem;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: .25em;
      text-transform: uppercase;
      box-sizing: border-box;
      outline: none;
      transition: border-color .15s;
    }
    .landing-input:focus {
      border-color: var(--accent);
    }
    .landing-input::placeholder {
      font-weight: 400;
      letter-spacing: .05em;
      text-transform: none;
      font-size: 1rem;
      color: var(--muted);
      opacity: .7;
    }
    .landing-join-btn {
      display: block;
      width: 100%;
      max-width: 260px;
      margin: 1rem auto 0;
      padding: .8rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .landing-join-btn:hover:not(:disabled) { filter: brightness(1.25); }
    .landing-join-btn:active:not(:disabled) { transform: scale(.97); }
    .landing-join-btn:disabled { opacity: .35; cursor: default; }
    .landing-reconnect-wrap {
      width: 100%;
      max-width: 260px;
      margin: .45rem auto 0;
      display: none;
    }
    .landing-reconnect-label {
      font-size: .72rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: .25rem;
      letter-spacing: .01em;
    }
    .landing-reconnect-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      overflow: hidden;
    }
    .landing-reconnect-fill {
      width: 0%;
      height: 100%;
      background: #57bf88;
      transition: width .12s linear;
    }
    .landing-error {
      color: var(--danger);
      font-size: .85rem;
      font-weight: 600;
      margin-top: .8rem;
      min-height: 1.2em;
    }
    .landing-status {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 1.2rem;
      min-height: 1.2em;
    }
    @keyframes blink-fast { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>
</head>
<body>
  <div class="landing-card">
    <div class="landing-logo">Join a Session</div>

    <label class="landing-label" for="code-input">Enter session code</label>
    <input
      id="code-input"
      class="landing-input"
      type="text"
      maxlength="6"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="e.g. k7m2xp"
      oninput="onCodeInput()"
      onpaste="onCodePaste(event)"
      onkeydown="if(event.key==='Enter' && !document.getElementById('join-btn').disabled) joinSession();"
    />
    <button id="join-btn" class="landing-join-btn" disabled onclick="joinSession()">Join</button>
    <div id="reconnect-wrap" class="landing-reconnect-wrap" aria-live="polite">
      <div id="reconnect-label" class="landing-reconnect-label">Auto reconnecting</div>
      <div class="landing-reconnect-track">
        <div id="reconnect-fill" class="landing-reconnect-fill"></div>
      </div>
    </div>
    <div id="error-msg" class="landing-error"></div>
    <div id="status-msg" class="landing-status"></div>
  </div>

  <script>
    const SESSION_CODE_RE = /^[a-z0-9]{6}$/;
    const RETRY_INTERVAL_MS = 3000;
    const RETRY_DURATION_MS = 60000;
    const LOCAL_DAEMON_POLL_MS = 1000;
    let retryTimer = null;
    let retryUiTimer = null;
    let retryStartedAt = 0;
    let retryNextAt = 0;
    let retryCode = '';
    let retryAttemptInFlight = false;

    function getInputCode() {
      return (document.getElementById('code-input').value || '').trim().toLowerCase();
    }

    function isCompleteCode(code) {
      return SESSION_CODE_RE.test(String(code || '').toLowerCase());
    }

    function normalizeInputValue(raw) {
      return String(raw || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
    }

    function updateJoinButtonEnabled() {
      const btn = document.getElementById('join-btn');
      const code = getInputCode();
      btn.disabled = !isCompleteCode(code);
    }

    function clearRetryUi() {
      const btn = document.getElementById('join-btn');
      const wrap = document.getElementById('reconnect-wrap');
      const fill = document.getElementById('reconnect-fill');
      const statusEl = document.getElementById('status-msg');
      btn.textContent = 'Join';
      wrap.style.display = 'none';
      fill.style.width = '0%';
      statusEl.style.animation = '';
    }

    function stopAutoRetry(message) {
      if (retryTimer) clearInterval(retryTimer);
      if (retryUiTimer) clearInterval(retryUiTimer);
      retryTimer = null;
      retryUiTimer = null;
      retryAttemptInFlight = false;
      retryCode = '';
      clearRetryUi();
      if (message) {
        const statusEl = document.getElementById('status-msg');
        statusEl.textContent = message;
      }
    }

    async function attemptAutoReconnect() {
      if (retryAttemptInFlight) return;
      retryAttemptInFlight = true;
      const expectedCode = retryCode;
      try {
        const resp = await fetch('/api/status', { cache: 'no-store' });
        const data = resp.ok ? await resp.json() : null;
        if (data && data.session_active && String(data.session_id || '').toLowerCase() === expectedCode) {
          window.location.href = '/' + expectedCode;
          return;
        }
      } catch (_) {
        // ignore network hiccups, keep retrying
      } finally {
        retryAttemptInFlight = false;
      }
    }

    function renderRetryUi() {
      const now = Date.now();
      const btn = document.getElementById('join-btn');
      const wrap = document.getElementById('reconnect-wrap');
      const fill = document.getElementById('reconnect-fill');
      const label = document.getElementById('reconnect-label');
      const statusEl = document.getElementById('status-msg');
      if (!retryStartedAt) return;
      const elapsed = now - retryStartedAt;
      const remaining = Math.max(0, RETRY_DURATION_MS - elapsed);
      if (remaining <= 0) {
        stopAutoRetry('Auto-reconnect stopped after 1 minute.');
        return;
      }

      const cycleStart = retryNextAt - RETRY_INTERVAL_MS;
      const cycleElapsed = Math.max(0, Math.min(RETRY_INTERVAL_MS, now - cycleStart));
      const cycleProgress = Math.round((cycleElapsed / RETRY_INTERVAL_MS) * 100);
      const nextAttemptInSec = Math.max(0, (retryNextAt - now) / 1000);
      const remainingSec = Math.ceil(remaining / 1000);

      btn.textContent = 'Join';
      wrap.style.display = '';
      fill.style.width = `${cycleProgress}%`;
      label.textContent = `Auto reconnecting (${remainingSec}s left)`;
      statusEl.style.color = 'var(--muted)';
      statusEl.textContent = `Trying in ${nextAttemptInSec.toFixed(1)}s`;
    }

    function startAutoRetryIfNeeded(opts) {
      const options = opts || {};
      const code = getInputCode();
      if (!isCompleteCode(code)) {
        stopAutoRetry('');
        return;
      }
      if (retryCode === code && retryTimer) return;

      if (retryTimer) stopAutoRetry('');
      retryCode = code;
      retryStartedAt = Date.now();
      retryNextAt = Date.now() + RETRY_INTERVAL_MS;
      renderRetryUi();
      if (options.immediate) {
        attemptAutoReconnect();
      }

      retryUiTimer = setInterval(renderRetryUi, 120);
      retryTimer = setInterval(() => {
        const now = Date.now();
        if (now - retryStartedAt >= RETRY_DURATION_MS) {
          stopAutoRetry('Auto-reconnect stopped after 1 minute.');
          return;
        }
        if (now >= retryNextAt) {
          retryNextAt = now + RETRY_INTERVAL_MS;
          attemptAutoReconnect();
        }
      }, 150);
    }

    function onCodeInput() {
      const input = document.getElementById('code-input');
      const normalized = normalizeInputValue(input.value);
      if (input.value !== normalized) input.value = normalized;
      document.getElementById('error-msg').textContent = '';
      updateJoinButtonEnabled();
      startAutoRetryIfNeeded();
    }

    function onCodePaste(event) {
      // Smart paste: extract session code from full URL
      const pasted = (event.clipboardData || window.clipboardData).getData('text').trim();
      const urlMatch = pasted.match(/^https?:\/\/[^/]+\/([a-zA-Z0-9]{4,8})\/?$/);
      if (urlMatch) {
        event.preventDefault();
        const input = document.getElementById('code-input');
        input.value = normalizeInputValue(urlMatch[1]);
        onCodeInput();
      }
    }

    function joinSession() {
      const code = getInputCode();
      if (!code) return;
      if (!isCompleteCode(code)) {
        document.getElementById('error-msg').textContent = 'Code must be 6 alphanumeric characters.';
        return;
      }
      window.location.href = '/' + code;
    }

    // Check for error redirect and optional reconnect params
    (function initFromQuery() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('error') === 'invalid') {
        document.getElementById('error-msg').textContent = 'Invalid session code';
      }

      const codeParam = normalizeInputValue(params.get('code') || '');
      if (codeParam) {
        const input = document.getElementById('code-input');
        input.value = codeParam;
        onCodeInput();
        if (params.get('retry') === '1') {
          startAutoRetryIfNeeded({ immediate: true });
        }
      }
    })();

    // Auto-detect active session when running on host's machine.
    (function pollLocalDaemon() {
      let lastCode = null;

      function tryFetch() {
        fetch('http://localhost:8081/api/session/active', { signal: AbortSignal.timeout(800) })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            const code = normalizeInputValue(data && data.session_id);
            if (!isCompleteCode(code) || code === lastCode) return;
            lastCode = code;
            const input = document.getElementById('code-input');
            input.value = code;
            onCodeInput();
            stopAutoRetry('');
            joinSession();
          })
          .catch(() => { /* daemon not running or unreachable — silent skip */ });
      }

      tryFetch();
      setInterval(() => {
        tryFetch();
      }, LOCAL_DAEMON_POLL_MS);
    })();

  </script>

  <script src="/static/version.js"></script>
  <script src="/static/work-hours.js"></script>
  <script src="/static/version-age.js"></script>
  <script src="/static/version-reload.js"></script>
  <div class="version-tag" id="version-tag"></div>
  <script>window.renderDeployAge && window.renderDeployAge('version-tag');</script>
</body>
</html>
