[project]
name = "training-assistant"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "python-multipart>=0.0.20",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "uvicorn[standard]>=0.39.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=8.0",
    "httpx>=0.28",
    "requests>=2.32",
    "import-linter>=2.5",
    "vulture>=2.14",
    "ruff>=0.6",
]
daemon = [
    "anthropic>=0.85.0",
]
telemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-urllib>=0.41b0",
    "opentelemetry-distro>=0.41b0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "prod: smoke tests against the live Railway deployment",
    "load: load tests — connect many participants simultaneously",
    "nightly: slow tests run once per day in the nightly CI build, not on every push",
]

[tool.vulture]
paths = ["daemon", "railway"]
exclude = ["*/__pycache__/*", "tests/*", "docs/*", "openspec/*", "_bmad/*", ".context/*"]
ignore_decorators = ["@*"]
min_confidence = 80
sort_by_size = true

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["_bmad", "openspec", "static", "docs", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "File", "Form", "fastapi.Depends", "fastapi.File", "fastapi.Form"]
