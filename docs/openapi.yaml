components:
  schemas:
    ActivityReportRequest:
      properties:
        current_view:
          type: string
          title: Current View
          default: ''
        deltas:
          additionalProperties:
            $ref: '#/components/schemas/ViewEngagementDelta'
          type: object
          title: Deltas
          default: {}
      type: object
      title: ActivityReportRequest
    AdvancePhaseRequest:
      properties:
        phase:
          type: string
          title: Phase
      type: object
      required:
      - phase
      title: AdvancePhaseRequest
    AgendaResponse:
      properties:
        data:
          type: string
          title: Data
        filename:
          type: string
          title: Filename
      type: object
      required:
      - data
      - filename
      title: AgendaResponse
    AiResultRequest:
      properties:
        merges:
          items:
            $ref: '#/components/schemas/DebateAiMerge'
          type: array
          title: Merges
          default: []
        cleaned:
          items:
            $ref: '#/components/schemas/DebateAiCleaned'
          type: array
          title: Cleaned
          default: []
        new_arguments:
          items:
            $ref: '#/components/schemas/DebateAiNewArgument'
          type: array
          title: New Arguments
          default: []
      type: object
      title: AiResultRequest
    ArgumentRequest:
      properties:
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: ArgumentRequest
    AttentionGlobalStateResponse:
      properties:
        attention_enabled:
          type: boolean
          title: Attention Enabled
      type: object
      required:
      - attention_enabled
      title: AttentionGlobalStateResponse
    AvatarRequest:
      properties:
        rejected:
          items:
            type: string
          type: array
          title: Rejected
          default: []
      type: object
      title: AvatarRequest
    AvatarResponse:
      properties:
        avatar:
          type: string
          title: Avatar
      type: object
      required:
      - avatar
      title: AvatarResponse
    BugReportDiagnostics:
      properties:
        view:
          type: string
          title: View
          default: ''
        user_agent:
          type: string
          title: User Agent
          default: ''
        screen:
          type: string
          title: Screen
          default: ''
        url:
          type: string
          title: Url
          default: ''
      type: object
      title: BugReportDiagnostics
      description: 'Context the participant page knows about itself, attached to every
        report.


        Purely descriptive — the daemon never trusts these for any decision, it only

        sanitises them into the mail body (see ``_clean_diagnostic``).'
    BugReportRequest:
      properties:
        text:
          type: string
          title: Text
        diagnostics:
          $ref: '#/components/schemas/BugReportDiagnostics'
          default:
            view: ''
            user_agent: ''
            screen: ''
            url: ''
      type: object
      required:
      - text
      title: BugReportRequest
    ClaimTrainerRequest:
      properties:
        participant_id:
          type: string
          title: Participant Id
      type: object
      required:
      - participant_id
      title: ClaimTrainerRequest
    ClaimTrainerResponse:
      properties:
        granted:
          type: boolean
          title: Granted
        display_name:
          type: string
          title: Display Name
      type: object
      required:
      - granted
      - display_name
      title: ClaimTrainerResponse
    CodeReviewParticipantState:
      properties:
        snippet:
          anyOf:
          - type: string
          - type: 'null'
          title: Snippet
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        phase:
          anyOf:
          - type: string
          - type: 'null'
          title: Phase
        confirmed_lines:
          items:
            type: integer
          type: array
          title: Confirmed Lines
          default: []
        my_selections:
          items:
            type: integer
          type: array
          title: My Selections
          default: []
        line_percentages:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Line Percentages
      type: object
      title: CodeReviewParticipantState
    ConfirmLineRequest:
      properties:
        line:
          type: integer
          title: Line
      type: object
      required:
      - line
      title: ConfirmLineRequest
    ConfirmLineResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        confirmed_line:
          type: integer
          title: Confirmed Line
      type: object
      required:
      - confirmed_line
