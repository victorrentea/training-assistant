openapi: 3.1.0
info:
  title: Daemon Host Panel
  version: 0.1.0
paths:
  /api/participant/rejoin:
    post:
      tags:
      - participant
      summary: Rejoin Participant
      description: Lookup-only identity restore for returning UUIDs in current session.
      operationId: rejoin_participant_api_participant_rejoin_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
      x-feature: identity
  /api/participant/register:
    post:
      tags:
      - participant
      summary: Register Participant
      description: Register participant — assign name+avatar. Idempotent for returning
        participants.
      operationId: register_participant_api_participant_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
      x-feature: identity
  /api/participant/name:
    put:
      tags:
      - participant
      summary: Rename Participant
      description: 'Rename a registered participant. Returns 400 if not yet registered.


        A duplicate name is accepted (never a 409): the response carries a soft

        `name_conflict` flag and the participant stays admitted.'
      operationId: rename_participant_api_participant_name_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameResponse'
      x-feature: identity
  /api/participant/activity:
    post:
      tags:
      - participant
      summary: Report Activity
      description: 'Merge a participant''s per-view engagement deltas (active seconds/visits/clicks).


        Called by the participant page at most every ~30s while active, and on

        tab-hide/unload. Idle/backgrounded tabs send nothing.'
      operationId: report_activity_api_participant_activity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReportRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: identity
  /api/participant/roll-avatar:
    post:
      tags:
      - participant
      summary: Roll Avatar Endpoint
      description: Re-roll avatar (conference mode only).
      operationId: roll_avatar_endpoint_api_participant_roll_avatar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
      x-feature: identity
  /api/participant/location:
    put:
      tags:
      - participant
      summary: Set Location
      description: Store participant city/timezone.
      operationId: set_location_api_participant_location_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: identity
  /api/participant/state:
    get:
      tags:
      - participant
      summary: Get Participant State
      description: Return full personalised state for a participant — used on page
        load and WS reconnect.
      operationId: get_participant_state_api_participant_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantStateResponse'
      x-feature: participant_state
      x-doc-notes:
      - Returns participant-personalized full state snapshot.
  /api/{session_id}/host/participants/{participant_id}:
    delete:
      tags:
      - participant
      summary: Delete Participant
      description: Delete an inactive participant and everything they left behind.
      operationId: delete_participant_api__session_id__host_participants__participant_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
          title: Participant Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeReport'
      x-feature: identity
      x-doc-notes:
      - Purges roster entry, score, quiz/poll votes, own Q&A questions and debate
        arguments, upvotes, pastes and uploads (daemon/participant/purge.py).
      - 'Loopback-only: 403 for any request carrying the Railway proxy marker. 404
        for an unknown id. 409 while the participant is still active (connected, or
        heard from in the last 90s) — pass ?force=true to delete anyway.'
      - participant_id comes from GET /api/{session_id}/host/state → participants[].uuid.
  /api/{session_id}/host/participants/resolve-locations:
    post:
      tags:
      - participant
      summary: Resolve Participant Locations
      description: Backfill city name + timezone + country for all participants missing
        geo metadata.
      operationId: resolve_participant_locations_api__session_id__host_participants_resolve_locations_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '204':
          description: Successful Response
      x-feature: identity
  /api/participant/wordcloud/word:
    post:
      tags:
      - wordcloud
      summary: Submit Word
      description: Participant submits a word to the word cloud.
      operationId: submit_word_api_participant_wordcloud_word_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWordBody'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: wordcloud
  /api/{session_id}/host/wordcloud/word:
    post:
      tags:
      - wordcloud
      summary: Host Submit Word
      description: Host submits a word — same as participant but no scoring.
      operationId: host_submit_word_api__session_id__host_wordcloud_word_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitWordBody'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: wordcloud
  /api/{session_id}/host/wordcloud/topic:
    post:
      tags:
      - wordcloud
      summary: Set Topic
      description: Host sets the word cloud topic.
      operationId: set_topic_api__session_id__host_wordcloud_topic_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTopicBody'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: wordcloud
  /api/{session_id}/host/wordcloud/clear:
    post:
      tags:
      - wordcloud
      summary: Clear Wordcloud
      description: Host clears the word cloud.
      operationId: clear_wordcloud_api__session_id__host_wordcloud_clear_post
      responses:
        '204':
          description: Successful Response
      x-feature: wordcloud
  /api/participant/emoji/reaction:
    post:
      tags:
      - emoji
      summary: Emoji Reaction
      description: Participant sends an emoji reaction.
      operationId: emoji_reaction_api_participant_emoji_reaction_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmojiReactionRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: emoji
  /api/{session_id}/host/emoji/global-toggle:
    post:
      tags:
      - emoji
      summary: Toggle Emoji Global
      description: Host flips the session-wide emoji master switch and persists it.
      operationId: toggle_emoji_global_api__session_id__host_emoji_global_toggle_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmojiGlobalStateResponse'
      x-feature: emoji
  /api/participant/qa/submit:
    post:
      tags:
      - qa
      summary: Submit Question
      description: Participant submits a Q&A question.
      operationId: submit_question_api_participant_qa_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuestionBody'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/participant/qa/upvote:
    post:
      tags:
      - qa
      summary: Upvote Question
      description: Participant upvotes a Q&A question.
      operationId: upvote_question_api_participant_qa_upvote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpvoteQuestionBody'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/{session_id}/host/qa/submit:
    post:
      tags:
      - qa
      summary: Host Submit Question
      description: Host submits a Q&A question — no scoring.
      operationId: host_submit_question_api__session_id__host_qa_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuestionBody'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/{session_id}/host/qa/question/{question_id}/text:
    put:
      tags:
      - qa
      summary: Edit Question Text
      description: Host edits a question's text.
      operationId: edit_question_text_api__session_id__host_qa_question__question_id__text_put
      parameters:
      - name: question_id
        in: path
        required: true
        schema:
          type: string
          title: Question Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditQuestionTextBody'
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/{session_id}/host/qa/question/{question_id}:
    delete:
      tags:
      - qa
      summary: Delete Question
      description: Host deletes a question.
      operationId: delete_question_api__session_id__host_qa_question__question_id__delete
      parameters:
      - name: question_id
        in: path
        required: true
        schema:
          type: string
          title: Question Id
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/{session_id}/host/qa/question/{question_id}/answered:
    put:
      tags:
      - qa
      summary: Toggle Answered
      description: Host toggles a question's answered flag.
      operationId: toggle_answered_api__session_id__host_qa_question__question_id__answered_put
      parameters:
      - name: question_id
        in: path
        required: true
        schema:
          type: string
          title: Question Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleAnsweredBody'
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/{session_id}/host/qa/clear:
    post:
      tags:
      - qa
      summary: Clear Qa
      description: Host clears all Q&A questions.
      operationId: clear_qa_api__session_id__host_qa_clear_post
      responses:
        '204':
          description: Successful Response
      x-feature: qa
  /api/participant/bell:
    post:
      tags:
      - attention
      summary: Ring Bell
      description: Participant rings the attention bell (no request body).
      operationId: ring_bell_api_participant_bell_post
      responses:
        '204':
          description: Successful Response
      x-feature: attention
  /api/{session_id}/host/attention/global-toggle:
    post:
      tags:
      - attention
      summary: Toggle Attention Global
      description: 'Host flips the session-wide attention master switch, persists
        it, and

        broadcasts the new state so every connected participant updates live.'
      operationId: toggle_attention_global_api__session_id__host_attention_global_toggle_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionGlobalStateResponse'
      x-feature: attention
  /api/{session_id}/host/attention/notify:
    post:
      tags:
      - attention
      summary: Send Host Notification
      description: Host broadcasts a text notification to all participants (Direction
        A).
      operationId: send_host_notification_api__session_id__host_attention_notify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostNotificationRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: attention
  /api/participant/quiz/vote:
    post:
      tags:
      - quiz
      summary: Cast Vote
      description: Participant casts a vote.
      operationId: cast_vote_api_participant_quiz_vote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: quiz
      x-doc-notes:
      - 'Votes are mutable while the quiz is open: re-submitting overwrites the prior
        selection and updates voted_at.'
  /api/{session_id}/host/quiz/manual/submit:
    post:
      tags:
      - quiz
      summary: Create Quiz
      description: Host manually creates and immediately opens a new quiz.
      operationId: create_quiz_api__session_id__host_quiz_manual_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: quiz
  /api/{session_id}/host/quiz/end:
    post:
      tags:
      - quiz
      summary: End Quiz
      description: Host ends the quiz.
      operationId: end_quiz_api__session_id__host_quiz_end_post
      responses:
        '204':
          description: Successful Response
      x-feature: quiz
  /api/{session_id}/host/quiz/correct:
    put:
      tags:
      - quiz
      summary: Reveal Correct
      description: Host reveals correct answers and awards scores.
      operationId: reveal_correct_api__session_id__host_quiz_correct_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealCorrectRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: quiz
  /api/{session_id}/host/quiz/end/timer:
    post:
      tags:
      - quiz
      summary: Start Timer
      description: Host starts a countdown timer to end the quiz.
      operationId: start_timer_api__session_id__host_quiz_end_timer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTimerRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: quiz
  /api/{session_id}/host/quiz:
    get:
      tags:
      - quiz
      summary: Get Quiz State
      description: Return full quiz state for host quiz tab.
      operationId: get_quiz_state_api__session_id__host_quiz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostQuizStateResponse'
      x-feature: quiz
    delete:
      tags:
      - quiz
      summary: Delete Quiz
      description: Host deletes the current quiz.
      operationId: delete_quiz_api__session_id__host_quiz_delete
      responses:
        '204':
          description: Successful Response
      x-feature: quiz
  /api/{session_id}/host/poll:
    get:
      tags:
      - poll
      summary: Get Poll
      description: Host snapshot fetch on tab activation. Subsequent updates via WS.
      operationId: get_poll_api__session_id__host_poll_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      x-feature: poll
  /api/{session_id}/host/poll/update:
    put:
      tags:
      - poll
      summary: Update Poll
      description: 'Host pushes latest draft. Validates option deletion + multi flip

        while running, wipes votes on multi flip, broadcasts updates.'
      operationId: update_poll_api__session_id__host_poll_update_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollData'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: poll
  /api/{session_id}/host/poll/start:
    post:
      tags:
      - poll
      summary: Start Poll
      description: Validate the draft, set started, broadcast open signals.
      operationId: start_poll_api__session_id__host_poll_start_post
      responses:
        '204':
          description: Successful Response
      x-feature: poll
  /api/{session_id}/host/poll/stop:
    post:
      tags:
      - poll
      summary: Stop Poll
      description: 'End the live poll but keep the draft, votes and host_extras so

        participants and host both see the final results read-only until

        Clear. current_activity stays "poll" so participants do not get

        routed away from the view.'
      operationId: stop_poll_api__session_id__host_poll_stop_post
      responses:
        '204':
          description: Successful Response
      x-feature: poll
  /api/{session_id}/host/poll/clear:
    post:
      tags:
      - poll
      summary: Clear Poll
      description: 'Full reset: drop draft, votes, and host extras. Broadcasts activity
        off

        and pushes an empty host snapshot so all host tabs sync.'
      operationId: clear_poll_api__session_id__host_poll_clear_post
      responses:
        '204':
          description: Successful Response
      x-feature: poll
  /api/participant/poll/vote:
    post:
      tags:
      - poll
      summary: Cast Poll Vote
      description: Participant casts/changes their vote. Empty list clears the vote.
      operationId: cast_poll_vote_api_participant_poll_vote_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollVoteRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: poll
  /api/{session_id}/host/leaderboard/show:
    post:
      tags:
      - leaderboard
      summary: Show Leaderboard
      operationId: show_leaderboard_api__session_id__host_leaderboard_show_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowLeaderboardResponse'
      x-feature: scores_leaderboard
  /api/{session_id}/host/scores:
    delete:
      tags:
      - leaderboard
      summary: Reset Scores
      operationId: reset_scores_api__session_id__host_scores_delete
      responses:
        '204':
          description: Successful Response
      x-feature: scores_leaderboard
  /api/participant/paste:
    post:
      tags:
      - misc
      summary: Paste Text
      description: Participant pastes text to be seen by host.
      operationId: paste_text_api_participant_paste_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasteRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: paste_upload
  /api/participant/misc/bug-report:
    post:
      tags:
      - misc
      summary: Participant Bug Report
      description: "Participant reports a bug / requests a feature — emailed straight\
        \ to Victor.\n\nSECURITY NOTES\n- The recipient is env-only (NOTIFY_EMAIL);\
        \ nothing in this request can steer\n  where the mail goes.\n- The reporter's\
        \ name is resolved SERVER-SIDE from the participant id, never\n  taken from\
        \ the body, so a report cannot be signed as somebody else.\n- The mail is\
        \ plain text and every user-derived fragment that reaches the\n  subject goes\
        \ through header sanitisation, so neither HTML nor extra SMTP\n  headers can\
        \ be injected."
      operationId: participant_bug_report_api_participant_misc_bug_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugReportRequest'
        required: true
      responses:
        '204':
          description: Successful Response
      x-feature: bug_report
  /api/participant/notes:
    get:
      tags:
      - misc
      summary: Get Notes
      description: Get session notes content.
      operationId: get_notes_api_participant_notes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesResponse'
      x-feature: notes_summary
  /api/participant/summary:
    get:
      tags:
      - misc
      summary: Get Summary
      description: Get summary points and raw markdown.
      operationId: get_summary_api_participant_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
      x-feature: notes_summary
  /api/participant/files-md:
    get:
      tags:
      - misc
      summary: Get Files Md
      description: Return the per-session opened-files.md content with HTML comments
        stripped.
      operationId: get_files_md_api_participant_files_md_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesMdResponse'
      x-feature: misc
  /api/participant/prompts:
    get:
      tags:
      - misc
      summary: Get Prompts
      description: 'Return the agent prompts intercepted this session, oldest first.


        They are read back out of the same session notes file the macOS addon

        appends them to (each stamped 🤖), so the room sees exactly what was sent to

        the agent — no second store to keep in sync with the notes.'
      operationId: get_prompts_api_participant_prompts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptsResponse'
      x-feature: misc
  /api/participant/slides/decks:
    get:
      tags:
      - misc
      summary: Get Slides Decks
      description: Get slides cache status for all known decks; called on initial
        page load (decks_updated WS carries full data and replaces polling).
      operationId: get_slides_decks_api_participant_slides_decks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecksResponse'
      x-feature: slides
      x-doc-notes:
      - Returns cache status snapshot for all known decks on initial page load; decks_updated
        WS carries full data so no re-polling needed.
  /api/participant/slides/history:
    get:
      tags:
      - misc
      summary: Get Slides History
      description: Return accumulated slide viewing history for the current session.
      operationId: get_slides_history_api_participant_slides_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlidesHistoryResponse'
      x-feature: slides
  /api/participant/agenda:
    get:
      tags:
      - misc
      summary: Get Agenda
      description: Serve the agenda .docx as base64-encoded JSON (survives WS proxy).
      operationId: get_agenda_api_participant_agenda_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaResponse'
      x-feature: notes_summary
  /api/{session_id}/host/pastes:
    get:
      tags:
      - misc
      summary: Get Pastes
      description: Return all pending paste entries grouped by participant uuid.
      operationId: get_pastes_api__session_id__host_pastes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastsResponse'
      x-feature: paste_upload
  /api/{session_id}/host/notes:
    get:
      tags:
      - misc
      summary: Get Host Notes
      description: Return current session notes content.
      operationId: get_host_notes_api__session_id__host_notes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesResponse'
      x-feature: notes_summary
  /api/{session_id}/host/summary:
    get:
      tags:
      - misc
      summary: Get Host Summary
      description: Return summary points, raw markdown, and updated_at timestamp.
      operationId: get_host_summary_api__session_id__host_summary_get
