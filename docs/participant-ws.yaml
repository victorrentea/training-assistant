asyncapi: '2.6.0'
info:
  title: Training Assistant — Participant WebSocket Events
  version: '1.0'
  description: |
    Events received by participant browsers over WebSocket.
    Connection: WS wss://interact.victorrentea.ro/{session_id}/{participant_uuid}
    Participant WS is receive-only. All participant actions are REST calls.

servers:
  production:
    url: wss://interact.victorrentea.ro/{session_id}/{participant_uuid}
    protocol: wss

channels:
  /{session_id}/{participant_uuid}:
    subscribe:
      summary: Events received by participant
      message:
        oneOf:
          - $ref: '#/components/messages/current_slide_updated'
          - $ref: '#/components/messages/decks_updated'
          - $ref: '#/components/messages/activity_updated'
          - $ref: '#/components/messages/active_participants_count_updated'
          - $ref: '#/components/messages/participant_names_updated'
          - $ref: '#/components/messages/slides_history_updated'
          - $ref: '#/components/messages/quiz_opened'
          - $ref: '#/components/messages/quiz_ended'
          - $ref: '#/components/messages/quiz_correct_revealed'
          - $ref: '#/components/messages/quiz_cleared'
          - $ref: '#/components/messages/quiz_end_countdown_started'
          - $ref: '#/components/messages/poll_opened'
          - $ref: '#/components/messages/poll_updated'
          - $ref: '#/components/messages/scores_updated'
          - $ref: '#/components/messages/wordcloud_updated'
          - $ref: '#/components/messages/qa_updated'
          - $ref: '#/components/messages/codereview_opened'
          - $ref: '#/components/messages/codereview_selection_closed'
          - $ref: '#/components/messages/codereview_line_confirmed'
          - $ref: '#/components/messages/codereview_cleared'
          - $ref: '#/components/messages/debate_updated'
          - $ref: '#/components/messages/debate_timer'
          - $ref: '#/components/messages/debate_round_ended'
          - $ref: '#/components/messages/leaderboard_revealed'
          - $ref: '#/components/messages/notes_updated'
          - $ref: '#/components/messages/notes_appended'
          - $ref: '#/components/messages/summary_updated'
          - $ref: '#/components/messages/agenda_updated'
          - $ref: '#/components/messages/feedback_form_updated'
          - $ref: '#/components/messages/files_count_updated'
          - $ref: '#/components/messages/reload'
          - $ref: '#/components/messages/emoji_counters_updated'
          - $ref: '#/components/messages/attention_enabled'
          - $ref: '#/components/messages/host_notification'

components:
  messages:

    # ── Slides ────────────────────────────────────────────────────────────────

    current_slide_updated:
      summary: Host navigated to a new slide
      x-feature: slides
      payload:
        type: object
        required: [type, current_slide]
        properties:
          type:
            type: string
            enum: [current_slide_updated]
          current_slide:
            $ref: '#/components/schemas/CurrentSlide'

    decks_updated:
      summary: Deck cache status changed — contains full cache map to avoid polling
      x-feature: slides
      x-doc-notes:
        - "Compare incoming decks[slug].downloaded_at against previous value to detect content changes (re-download)."
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [decks_updated]
          decks:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Deck'
            default: {}

    # ── Activity ──────────────────────────────────────────────────────────────

    activity_updated:
      summary: Current activity type changed by host
      x-feature: activity
      payload:
        type: object
        required: [type, current_activity]
        properties:
          type:
            type: string
            enum: [activity_updated]
          current_activity:
            type: string
            enum: [none, quiz, wordcloud, qa, codereview, debate]

    # ── Identity ──────────────────────────────────────────────────────────────

    active_participants_count_updated:
      summary: Participant total count changed
      x-feature: identity
      x-doc-notes:
        - "'count' includes all known non-host participants in the active session."
      payload:
        type: object
        required: [type, count]
        properties:
          type:
            type: string
            enum: [active_participants_count_updated]
          count:
            type: integer

    participant_names_updated:
      summary: Roster display names changed (join / rename / leave)
      x-feature: identity
      x-doc-notes:
        - "SECURITY: display names only — never UUIDs or any stable per-user id (a leaked UUID enables impersonation via X-Participant-ID)."
        - "In-session duplicate detection is UUID-free: count occurrences of your own name in 'names' (>=2 => duplicate)."
      payload:
        type: object
        required: [type, names]
        properties:
          type:
            type: string
            enum: [participant_names_updated]
          names:
            type: array
            items:
              type: string

    slides_history_updated:
      summary: Participant slide history count changed
      x-feature: slides
      payload:
        type: object
        required: [type, count]
        properties:
          type:
            type: string
            enum: [slides_history_updated]
          count:
            type: integer

    # ── Quiz ─────────────────────────────────────────────────────────────────

    quiz_opened:
      summary: Quiz opened for voting
      x-feature: quiz
      x-doc-notes:
        - Participants can vote only while quiz is open.
      payload:
        type: object
        required: [type, quiz]
        properties:
          type:
            type: string
            enum: [quiz_opened]
          quiz:
            $ref: '#/components/schemas/Quiz'

    quiz_ended:
      summary: Voting closed by host
      x-feature: quiz
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [quiz_ended]

    quiz_correct_revealed:
      summary: Host revealed correct answers
      x-doc-notes:
        - Participants use correct_indices (0-based) to highlight correct options in the UI.
      x-feature: quiz
      payload:
        type: object
        required: [type, correct_indices]
        properties:
          type:
            type: string
            enum: [quiz_correct_revealed]
          correct_indices:
            type: array
            items:
              type: integer
            description: 0-based indices of correct options

    quiz_cleared:
      summary: Quiz removed by host
      x-feature: quiz
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [quiz_cleared]

    quiz_end_countdown_started:
      summary: Host started a countdown timer for the quiz
      x-feature: quiz
      payload:
        type: object
        required: [type, seconds, started_at]
        properties:
          type:
            type: string
            enum: [quiz_end_countdown_started]
          seconds:
            type: integer
          started_at:
            type: string
            format: date-time

    # ── Poll ──────────────────────────────────────────────────────────────────

    poll_opened:
      summary: Poll started by host — participant should reset per-session vote tracking
      x-feature: poll
      x-doc-notes:
        - Bare signal; WS ordering guarantees poll_updated arrives immediately after.
        - Participant should clear any previously stored vote selection on receiving this.
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [poll_opened]

    poll_updated:
      summary: Poll snapshot — fires on start, host edits, stop, and votes when public=true
      x-feature: poll
      x-doc-notes:
        - "`counts` is present when `poll.public` is true OR when the poll has been ended (read-only results until Clear); absent → hide per-option bars."
        - "`counts[i]` is the number of votes for `poll.options[i]`."
        - "`ended=true` flips the participant UI to a read-only results view that lingers until host clicks Clear."
      payload:
        type: object
        required: [type, poll]
        properties:
          type:
            type: string
            enum: [poll_updated]
          poll:
            $ref: '#/components/schemas/Poll'
          counts:
            type: array
            items:
              type: integer
            nullable: true
            description: Per-option vote counts; present when poll.public OR poll has been ended
          ended:
            type: boolean
            default: false
            description: True after host clicked Stop, until Clear is clicked. Participant view becomes read-only.

    # ── Scores ────────────────────────────────────────────────────────────────

    scores_updated:
      summary: One or more participants' scores changed
      x-feature: scores_leaderboard
      payload:
        type: object
        required: [type, scores]
        properties:
          type:
            type: string
            enum: [scores_updated]
          scores:
            type: object
            additionalProperties:
              type: integer
            description: >-
              opaque per-session score token → score. NOT keyed by UUID — each
              participant learns only its own token via GET /state
              (my_score_token) and reads scores[my_score_token]. The token cannot
              be replayed as an X-Participant-ID identity.

    # ── Word Cloud ────────────────────────────────────────────────────────────

    wordcloud_updated:
      summary: Word cloud state changed (new word or topic update)
      x-feature: wordcloud
      payload:
        type: object
        required: [type, words, word_order, topic]
        properties:
          type:
            type: string
            enum: [wordcloud_updated]
          words:
            type: object
            additionalProperties:
              type: integer
            description: word → count
          word_order:
            type: array
            items:
              type: string
            description: Newest-first insertion order
          topic:
            type: string

    # ── Q&A ───────────────────────────────────────────────────────────────────

    qa_updated:
      summary: Q&A list changed (new question, upvote, edit, delete)
      x-feature: qa
      payload:
        type: object
        required: [type, questions]
        properties:
          type:
            type: string
            enum: [qa_updated]
          questions:
            type: array
            items:
              $ref: '#/components/schemas/QAQuestion'

    # ── Code Review ───────────────────────────────────────────────────────────

    codereview_opened:
      summary: Host opened a code snippet for review
      x-feature: codereview
      payload:
        type: object
        required: [type, snippet, language]
        properties:
          type:
            type: string
            enum: [codereview_opened]
          snippet:
            type: string
          language:
            type: string
            nullable: true

    codereview_selection_closed:
      summary: Host closed the line selection phase
      x-feature: codereview
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [codereview_selection_closed]

    codereview_line_confirmed:
      summary: Host confirmed a line as problematic
      x-feature: codereview
      payload:
        type: object
        required: [type, line]
        properties:
          type:
            type: string
            enum: [codereview_line_confirmed]
          line:
            type: integer

    codereview_cleared:
      summary: Code review removed by host
      x-feature: codereview
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [codereview_cleared]

    # ── Debate ────────────────────────────────────────────────────────────────

    debate_updated:
      summary: UUID-free debate state snapshot (participant-facing)
      x-feature: debate
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [debate_updated]
          statement:
            type: string
            nullable: true
          phase:
            type: string
            nullable: true
            enum: [null, side_selection, arguments, ai_cleanup, prep, live_debate, ended]
          side_counts:
            type: object
            additionalProperties:
              type: integer
            description: >-
              Aggregate members per side ("for"/"against" → count). Replaces the
              old uuid→side map — this frame carries NO participant UUIDs.
          arguments:
            type: array
            items:
              $ref: '#/components/schemas/DebateArgument'
          champions:
            type: object
            additionalProperties:
              type: boolean
            description: '"for"|"against" → whether that side has claimed a champion (no uuid)'
          first_side:
            type: string
            nullable: true
          round_index:
            type: integer
            nullable: true
          round_timer_seconds:
            type: integer
            nullable: true
          round_timer_started_at:
            type: string
            format: date-time
            nullable: true

    debate_timer:
      summary: A timed debate round started
      x-feature: debate
      payload:
        type: object
        required: [type, round_index, seconds, started_at]
        properties:
          type:
            type: string
            enum: [debate_timer]
          round_index:
            type: integer
          seconds:
            type: integer
          started_at:
            type: string
            format: date-time

    debate_round_ended:
      summary: Current debate round ended
      x-feature: debate
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [debate_round_ended]

    # ── Leaderboard ──────────────────────────────────────────────────────────

    leaderboard_revealed:
      summary: Leaderboard overlay shown with top positions
      x-feature: scores_leaderboard
      payload:
        type: object
        required: [type, positions]
        properties:
          type:
            type: string
            enum: [leaderboard_revealed]
          positions:
            type: array
            items:
              $ref: '#/components/schemas/LeaderboardPosition'

    # ── Notes & Summary ──────────────────────────────────────────────────────

    notes_updated:
      summary: Notes file changed — mtime timestamp updated
      x-feature: notes_summary
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [notes_updated]
          updated_at:
            type: string
            format: date-time
            nullable: true
            description: ISO timestamp of notes file mtime

    notes_appended:
      summary: A fresh snippet was appended to the session notes — toast it for copy
      x-feature: notes_summary
      payload:
        type: object
        required: [type, text, at]
        properties:
          type:
            type: string
            enum: [notes_appended]
          text:
            type: string
            description: The newly-appended snippet (bullet stripped, trimmed)
          at:
            type: string
            format: date-time
            description: ISO timestamp when the daemon observed the append

    summary_updated:
      summary: AI summary file changed — mtime timestamp updated
      x-feature: notes_summary
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [summary_updated]
          updated_at:
            type: string
            format: date-time
            nullable: true
            description: ISO timestamp of ai-summary.md mtime

    agenda_updated:
      summary: Agenda .docx availability changed in the session folder
      x-feature: notes_summary
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [agenda_updated]
          has_agenda:
            type: boolean
            description: Whether an agenda .docx is available in the session folder

    feedback_form_updated:
      summary: End-of-session participant feedback form link published or retracted
      x-feature: notes_summary
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [feedback_form_updated]
          feedback_url:
            type: string
            nullable: true
            description: Published freeonlinesurveys URL, or null when cleared

    # ── Files ─────────────────────────────────────────────────────────────────

    files_count_updated:
      summary: Number of files opened this session changed
      x-feature: files
      payload:
        type: object
        required: [type, count]
        properties:
          type:
            type: string
            enum: [files_count_updated]
          count:
            type: integer

    # ── Cross-cutting ────────────────────────────────────────────────────────

    reload:
      summary: Daemon synced static files — browser should reload
      x-feature: reload
      x-doc-notes:
        - Client should trigger full page reload to pick up new static assets.
      payload:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [reload]

    # ── Emoji ─────────────────────────────────────────────────────────────────

    emoji_counters_updated:
      summary: Cumulative emoji reaction counts for the current talk session
      x-feature: emoji
      payload:
        type: object
        required: [type, counters]
        properties:
          type:
            type: string
            enum: [emoji_counters_updated]
          counters:
            type: object
            additionalProperties:
              type: integer
            description: Map of emoji character to total reaction count

    # ── Attention (bell + host notifications) ─────────────────────────────────

    attention_enabled:
      summary: Host flipped the attention master switch — participants update live
      x-feature: attention
      x-doc-notes:
        - Carries a boolean only (no UUIDs). Show/hide the bell button and the
          notification-permission indicator without reloading the page.
      payload:
        type: object
        required: [type, enabled]
        properties:
          type:
            type: string
            enum: [attention_enabled]
          enabled:
            type: boolean
            description: Whether the attention capability is now on

    host_notification:
      summary: Host broadcast a text notification to all participants
      x-feature: attention
      x-doc-notes:
        - Carries free text + a timestamp only (no UUIDs). Rendered as a native
          OS Notification when permission is granted, otherwise an in-page toast;
          both paths play a sound.
      payload:
        type: object
        required: [type, text, at]
        properties:
          type:
            type: string
            enum: [host_notification]
          text:
            type: string
            description: The host's notification message
          at:
            type: string
            description: ISO-8601 timestamp when the daemon broadcast it

  schemas:

    CurrentSlide:
      type: object
      required: [slug, page]
      properties:
        slug:
          type: string
        page:
          type: integer

    Deck:
      type: object
      required: [status, title]
      properties:
        status:
          type: string
          enum: [not_cached, cached, downloading, download_failed]
        size_bytes:
          type: integer
          nullable: true
        downloaded_at:
          type: string
          format: date-time
          nullable: true
        modified_at:
          type: string
          format: date-time
          nullable: true
        title:
          type: string
        error:
          type: string
          nullable: true

    Poll:
      type: object
      required: [question, options, multi, public]
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
        multi:
          type: boolean
        public:
          type: boolean
          description: When true, counts are broadcast to participants

    Quiz:
      type: object
      required: [id, question, options, multi]
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: string
          description: Quiz options as plain text strings
        multi:
          type: boolean

    QAQuestion:
      type: object
      required: [id, text, upvote_count, answered, timestamp]
      description: >-
        Participant-facing Q&A item — UUID-free. No author/upvoter UUIDs; only the
        aggregate upvote_count. "Is this mine / have I upvoted" is resolved
        server-side per connection and delivered via GET /state.
      properties:
        id:
          type: string
        text:
          type: string
        upvote_count:
          type: integer
        answered:
          type: boolean
        timestamp:
          type: number

    DebateArgument:
      type: object
      required: [id, side, text, upvote_count, ai_generated]
      description: >-
        Participant-facing debate argument — UUID-free. No author_uuid / upvoter
        list; only the aggregate upvote_count.
      properties:
        id:
          type: string
        side:
          type: string
          enum: [for, against]
        text:
          type: string
        upvote_count:
          type: integer
        ai_generated:
          type: boolean
        merged_into:
          type: string
          nullable: true

    LeaderboardPosition:
      type: object
      required: [rank, name, score, avatar]
      properties:
        rank:
          type: integer
        name:
          type: string
        score:
          type: integer
        avatar:
          type: string
